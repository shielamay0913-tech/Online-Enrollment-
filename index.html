<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EnrollEase – Online Enrollment System</title>
<style>

    :root {
      --navy: #142b55;
      --blue: #2864dc;
      --blue-dark: #194bb4;
      --sky: #eaf2ff;
      --ink: #1d2b45;
      --muted: #71809a;
      --line: #e4eaf3;
      --surface: #ffffff;
      --bg: #f5f7fc;
      --green: #16845b;
      --orange: #a65c09;
      --shadow: 0 14px 36px rgba(29, 57, 105, .08);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: Inter, "Segoe UI", Arial, sans-serif; line-height: 1.5;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { display: flex; min-height: 100vh; }
    .sidebar {
      width: 250px; background: var(--navy); color: white; padding: 26px 17px;
      display: flex; flex-direction: column; flex-shrink: 0;
    }
    .brand { display: flex; gap: 12px; align-items: center; padding: 0 9px 30px; }
    .brand-mark {
      width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center;
      background: #fff; color: var(--blue); font-size: 22px; font-weight: 900;
    }
    .brand strong { display: block; font-size: 15px; letter-spacing: .1px; }
    .brand small { color: #b8c9e8; font-size: 11px; }
    .nav-label { color: #8fa7d0; text-transform: uppercase; letter-spacing: 1.5px; font-size: 10px; font-weight: 800; padding: 9px 13px; }
    .nav { display: grid; gap: 7px; }
    .nav button {
      color: #c9d6ee; background: transparent; border: 0; border-radius: 11px;
      padding: 12px 13px; text-align: left; display: flex; gap: 12px; align-items: center;
      transition: .2s;
    }
    .nav button span { width: 20px; text-align: center; font-size: 17px; }
    .nav button:hover, .nav button.active { background: #244274; color: white; }
    .nav button.active { box-shadow: inset 3px 0 #77a7ff; }
    .side-bottom { margin-top: auto; padding: 20px 9px 0; }
    .help-card { border: 1px solid #35517e; border-radius: 14px; padding: 15px; background: #1a3563; }
    .help-card strong { font-size: 13px; }
    .help-card p { font-size: 11px; color: #c0d0ea; margin: 6px 0 12px; }
    .help-card a { color: #fff; font-size: 12px; font-weight: 700; }
    main { min-width: 0; flex: 1; }
    .topbar {
      height: 78px; display: flex; align-items: center; justify-content: space-between;
      padding: 0 36px; background: rgba(255,255,255,.9); border-bottom: 1px solid var(--line);
      gap: 20px;
    }
    .crumb { color: var(--muted); font-size: 13px; }
    .crumb strong { color: var(--ink); }
    .top-actions { display: flex; align-items: center; gap: 17px; }
    .icon-button { border: 1px solid var(--line); background: white; border-radius: 11px; width: 40px; height: 40px; color: var(--navy); font-size: 17px; position: relative; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #ef5c67; position: absolute; right: 8px; top: 7px; border: 1px solid white; }
    .profile { display: flex; gap: 10px; align-items: center; }
    .avatar { width: 39px; height: 39px; border-radius: 50%; background: #dce8ff; color: var(--blue-dark); display: grid; place-items: center; font-weight: 800; }
    .profile strong { display: block; font-size: 12px; }
    .profile small { display: block; color: var(--muted); font-size: 11px; }
    .content { max-width: 1440px; margin: auto; padding: 30px 36px 45px; }
    .welcome { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 24px; }
    .eyebrow { color: var(--blue); text-transform: uppercase; font-size: 10px; font-weight: 900; letter-spacing: 1.8px; }
    h1 { margin: 5px 0 5px; font-size: clamp(25px, 3vw, 33px); letter-spacing: -.8px; color: var(--navy); }
    .welcome p { margin: 0; color: var(--muted); font-size: 14px; }
    .btn { border: 0; border-radius: 10px; padding: 11px 16px; font-weight: 750; font-size: 13px; transition: .2s; }
    .btn-primary { color: white; background: var(--blue); box-shadow: 0 7px 15px rgba(40,100,220,.18); }
    .btn-primary:hover { background: var(--blue-dark); transform: translateY(-1px); }
    .btn-light { color: var(--navy); background: white; border: 1px solid var(--line); }
    .hero {
      background: linear-gradient(115deg, #1d4fb3, #3479ed); color: white; border-radius: 20px;
      padding: 26px 30px; display: flex; align-items: center; justify-content: space-between;
      gap: 24px; overflow: hidden; position: relative; box-shadow: var(--shadow); margin-bottom: 22px;
    }
    .hero:after { content: ""; position: absolute; width: 240px; height: 240px; border: 40px solid rgba(255,255,255,.07); border-radius: 50%; right: 20%; top: -145px; }
    .hero-copy { position: relative; z-index: 1; max-width: 600px; }
    .hero .tag { display: inline-block; padding: 5px 9px; border-radius: 6px; background: rgba(255,255,255,.17); font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
    .hero h2 { font-size: 23px; margin: 11px 0 7px; }
    .hero p { margin: 0; color: #dbe8ff; font-size: 13px; max-width: 530px; }
    .hero .btn { position: relative; z-index: 1; background: white; color: var(--blue-dark); white-space: nowrap; }
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 17px; margin-bottom: 23px; }
    .stat, .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 5px 20px rgba(29,57,105,.025); }
    .stat { padding: 19px 20px; display: flex; align-items: center; gap: 15px; }
    .stat-icon { width: 45px; height: 45px; border-radius: 13px; display: grid; place-items: center; font-size: 20px; background: var(--sky); }
    .stat:nth-child(2) .stat-icon { background: #fff3df; }
    .stat:nth-child(3) .stat-icon { background: #e1f7ed; }
    .stat small { color: var(--muted); font-size: 11px; font-weight: 700; display: block; }
    .stat strong { font-size: 21px; display: block; margin-top: 2px; color: var(--navy); }
    .stat .sub { font-size: 10px; color: var(--muted); }
    .layout { display: grid; grid-template-columns: minmax(0,1.55fr) minmax(280px,.85fr); gap: 22px; align-items: start; }
    .panel { padding: 23px; margin-bottom: 22px; }
    .panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 20px; }
    .panel h3 { margin: 0; color: var(--navy); font-size: 16px; }
    .panel-head p { color: var(--muted); margin: 4px 0 0; font-size: 12px; }
    .step-pill { background: var(--sky); color: var(--blue-dark); font-size: 10px; font-weight: 800; padding: 6px 9px; border-radius: 7px; white-space: nowrap; }
    .progress { display: flex; gap: 7px; margin-bottom: 24px; }
    .progress span { height: 5px; flex: 1; border-radius: 5px; background: #e6ebf4; }
    .progress span.done { background: var(--blue); }
    .form-section { border-top: 1px solid var(--line); padding-top: 20px; margin-top: 20px; }
    .form-section h4 { font-size: 13px; margin: 0 0 15px; color: var(--navy); display: flex; gap: 8px; align-items: center; }
    .number { width: 23px; height: 23px; display: grid; place-items: center; border-radius: 7px; background: var(--sky); color: var(--blue); font-size: 11px; }
    .fields { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 15px; }
    .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .field.full { grid-column: 1 / -1; }
    label { font-size: 11px; font-weight: 800; color: #4e5d77; }
    input, select, textarea { width: 100%; border: 1px solid #dce4f0; background: #fbfcff; color: var(--ink); border-radius: 9px; padding: 11px 12px; outline: none; font-size: 12px; }
    input:focus, select:focus, textarea:focus { border-color: #77a2f2; box-shadow: 0 0 0 3px #e9f1ff; }
    input[type=file] { padding: 9px; background: white; }
    .hint { color: var(--muted); font-size: 10px; }
    .upload-box { border: 1px dashed #b9c9e4; border-radius: 11px; padding: 15px; background: #f9fbff; }
    .upload-box p { margin: 4px 0 10px; font-size: 10px; color: var(--muted); }
    .checkline { display: flex; gap: 9px; align-items: flex-start; color: #5d6b82; font-size: 11px; margin: 18px 0; }
    .checkline input { width: auto; margin-top: 3px; }
    .form-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 20px; }
    .status { font-size: 10px; padding: 5px 9px; border-radius: 20px; font-weight: 800; display: inline-block; }
    .status.pending { color: var(--orange); background: #fff3df; }
    .status.unpaid { color: #b13b4a; background: #ffebee; }
    .status.confirmed { color: var(--green); background: #e2f7ee; }
    .record-row { display: flex; gap: 12px; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line); }
    .record-row:last-child { border-bottom: 0; padding-bottom: 0; }
    .file-icon { width: 38px; height: 40px; display: grid; place-items: center; border-radius: 9px; background: #fff0f0; color: #d14e58; font-weight: 900; font-size: 10px; }
    .record-row strong { display: block; font-size: 12px; }
    .record-row small { color: var(--muted); font-size: 10px; display: block; }
    .record-row .push { margin-left: auto; }
    .link-btn { color: var(--blue); border: 0; background: none; font-size: 11px; font-weight: 800; padding: 5px; }
    .fee-line { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; padding: 9px 0; color: #56647b; }
    .fee-line strong { color: var(--ink); }
    .fee-total { border-top: 1px solid var(--line); margin-top: 7px; padding-top: 15px; font-size: 13px; }
    .fee-total strong { font-size: 17px; color: var(--navy); }
    .payment-method { border: 1px solid #d9e5f8; border-radius: 12px; padding: 15px; background: #f8fbff; margin-top: 13px; }
    .payment-method h4 { margin: 0 0 5px; font-size: 12px; }
    .payment-method p { margin: 0; color: var(--muted); font-size: 10px; }
    .qr-placeholder { width: 115px; height: 115px; margin: 14px auto; background: white; border: 1px dashed #9db4dc; border-radius: 8px; display: grid; place-items: center; text-align: center; color: #6680ad; font-size: 10px; padding: 12px; }
    .qr-placeholder span { font-size: 28px; display: block; }
    .timeline { margin-top: 3px; }
    .timeline-item { display: flex; gap: 12px; padding-bottom: 19px; position: relative; }
    .timeline-item:not(:last-child):before { content: ""; position: absolute; left: 10px; top: 23px; height: calc(100% - 20px); width: 1px; background: #dce5f2; }
    .timeline-dot { width: 21px; height: 21px; border-radius: 50%; background: #e8effb; border: 5px solid #d3e1fa; flex-shrink: 0; }
    .timeline-item.current .timeline-dot { background: var(--blue); border-color: #dce8ff; }
    .timeline-item strong { display: block; font-size: 11px; }
    .timeline-item small { display: block; color: var(--muted); font-size: 10px; margin-top: 3px; }
    .notice { display: flex; gap: 10px; padding: 13px; background: #fff8e9; border: 1px solid #f6e5bc; border-radius: 11px; color: #8d641d; font-size: 11px; }
    .notice b { display: block; margin-bottom: 2px; }
    .footer { text-align: center; color: #94a0b4; font-size: 10px; padding: 8px 0 20px; }
    .toast { position: fixed; right: 22px; bottom: 22px; z-index: 10; background: #17345f; color: white; border-radius: 12px; padding: 14px 18px; box-shadow: var(--shadow); font-size: 12px; display: none; max-width: 330px; }
    .toast.show { display: block; animation: pop .25s ease-out; }
    @keyframes pop { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .mobile-menu { display: none; }
    @media (max-width: 1050px) {
      .sidebar { width: 215px; }
      .content { padding: 25px 22px 35px; }
      .topbar { padding: 0 22px; }
      .layout { grid-template-columns: minmax(0,1.2fr) minmax(250px,.8fr); gap: 15px; }
      .panel { padding: 18px; }
    }
    @media (max-width: 780px) {
      .sidebar { width: 68px; padding: 20px 9px; }
      .brand { padding: 0 3px 28px; justify-content: center; }
      .brand > div:last-child, .nav-label, .nav button .nav-text, .help-card { display: none; }
      .nav button { justify-content: center; padding: 12px 5px; }
      .nav button span { width: auto; }
      .side-bottom { padding: 0; }
      .topbar { height: 68px; padding: 0 15px; }
      .content { padding: 22px 15px 30px; }
      .layout { grid-template-columns: 1fr; }
      .stats { gap: 10px; }
      .stat { padding: 14px 12px; gap: 9px; }
      .stat-icon { width: 36px; height: 36px; font-size: 17px; }
      .stat strong { font-size: 17px; }
      .hero { padding: 22px; }
      .profile .profile-info { display: none; }
    }
    @media (max-width: 520px) {
      .welcome { align-items: flex-start; flex-direction: column; }
      .welcome .btn { width: 100%; }
      .hero { align-items: flex-start; flex-direction: column; }
      .hero .btn { width: 100%; }
      .stats { grid-template-columns: 1fr; }
      .stat { padding: 13px 16px; }
      .fields { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .top-actions { gap: 9px; }
      .crumb { font-size: 11px; }
      .panel-head { flex-direction: column; }
      .form-actions .btn { flex: 1; }
    }
  
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.status.enrolled{color:var(--green);background:#e2f7ee}
.gate{max-width:820px;margin:0 auto;padding:40px 18px}.gate .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin:22px 0}
.gate h1{margin-top:14px}.gate .panel{margin:0}
.tbl{width:100%;border-collapse:collapse;font-size:12px}.tbl th,.tbl td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}.tbl th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.6px}
.pdfv{background:#eef1f7;border-radius:8px;padding:10px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.pdfv .pg{display:block;width:100%;height:auto;margin:0 0 10px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}.pdfv .pg:last-child{margin-bottom:0}.pgf{width:100%;height:70vh;border:0;background:#fff}.mod.pdfm{padding:0;place-items:stretch}.mod.pdfm .box{max-width:none;max-height:none;width:100%;height:100%;border-radius:0;padding:0;display:flex;flex-direction:column;overflow:hidden}.pdfh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;border-bottom:1px solid var(--line);background:#fff}.pdfz{display:flex;align-items:center;gap:6px}.pdfz .btn{padding:8px 12px}.pdfz span{min-width:44px;text-align:center;font-size:12px;font-weight:700}.pdfs{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;background:#eef1f7;padding:8px}.pdfs .pdfv{padding:0;border-radius:0;background:transparent}.pdfs .pgf{height:100%;min-height:80vh}
.filecard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink)}.filecard:hover{background:#f6f9ff;border-color:#c5d6f5}.filecard strong{display:block;font-size:13px}.filecard small{display:block;color:var(--muted);font-size:11px}.filecard .go{margin-left:auto;color:var(--blue);font-size:11px;font-weight:800;white-space:nowrap}
.tw{overflow-x:auto}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.mod{position:fixed;inset:0;background:rgba(20,43,85,.55);display:grid;place-items:center;padding:16px;z-index:20}
.mod .box{background:#fff;border-radius:16px;padding:22px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
.chk{display:flex;gap:9px;align-items:center;padding:7px 0;font-size:12px;border-bottom:1px solid var(--line)}.chk i{font-style:normal;font-weight:800}.ok{color:var(--green)}.no{color:#b13b4a}
.thumb{max-width:100%;max-height:170px;border-radius:8px;border:1px solid var(--line);margin-top:6px;display:block;cursor:zoom-in}
.err{color:#b13b4a;font-size:11px;min-height:16px}
.nf{padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.nf small{color:var(--muted);display:block}
.count{margin-left:auto;background:#ef5c67;color:#fff;border-radius:99px;font-size:10px;padding:0 7px;font-weight:800}.nav button .count{width:auto}
.sw{color:#c9d6ee;background:transparent;border:1px solid #35517e;border-radius:11px;padding:11px;width:100%}
.sidebar{position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto}
@media(max-width:780px){.sw .t{display:none}}
.paper{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}.tbl tr.me td{background:#fff3c4}
.rule{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted);padding:3px 0}.rule .rc{width:18px;height:18px;border-radius:50%;border:1.5px solid #b9c4d8;display:grid;place-items:center;font-size:11px;font-weight:900;color:#fff;flex-shrink:0;line-height:1}.rule.ok{color:var(--green)}.rule.ok .rc{background:var(--green);border-color:var(--green)}
.rule.bad{color:#b13b4a}.rule.bad .rc{border-color:#d9626f;color:#b13b4a;background:#fff}

/* ---- backgrounds ---- */
body{background:var(--bg)}
body::before{content:"";position:fixed;inset:-170px;z-index:-1;pointer-events:none;background:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22170%22 height=%22170%22 viewBox=%220 0 170 170%22 fill=%22none%22 stroke=%22%232864dc%22 stroke-opacity=%22.08%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%0A%3Cg transform=%22translate(18 20)%22%3E%3Cpath d=%22M0 14 L26 2 L52 14 L26 26 Z%22/%3E%3Cpath d=%22M12 20 v12 c9 7 19 7 28 0 v-12%22/%3E%3Cpath d=%22M52 14 v14%22/%3E%3C/g%3E%0A%3Cg transform=%22translate(104 92)%22%3E%3Crect x=%220%22 y=%220%22 width=%2232%22 height=%2240%22 rx=%223%22/%3E%3Cpath d=%22M9 0 v40 M16 12 h11 M16 20 h11%22/%3E%3C/g%3E%0A%3Cg transform=%22translate(20 98)%22%3E%3Cpath d=%22M4 40 l32 -32 l10 10 l-32 32 l-15 5 z%22/%3E%3Cpath d=%22M36 8 l10 10%22/%3E%3C/g%3E%0A%3Cg transform=%22translate(108 14)%22%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%2210%22/%3E%3Cpath d=%22M12 6 v7 l5 3%22/%3E%3C/g%3E%0A%3Ccircle cx=%2286%22 cy=%2270%22 r=%222.5%22/%3E%3Ccircle cx=%22150%22 cy=%2270%22 r=%222.5%22/%3E%3Ccircle cx=%2276%22 cy=%22154%22 r=%222.5%22/%3E%0A%3C/svg%3E");animation:drift 45s linear infinite;will-change:transform}
body.welcome-bg::after{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(circle at 20% 30%,rgba(40,100,220,.22),transparent 35%),radial-gradient(circle at 80% 25%,rgba(22,132,91,.16),transparent 30%),radial-gradient(circle at 60% 80%,rgba(40,100,220,.14),transparent 35%);animation:floaty 18s ease-in-out infinite alternate;will-change:transform}
.bob{animation:bob 3.2s ease-in-out infinite}
@keyframes drift{to{transform:translate(170px,170px)}}
@keyframes floaty{from{transform:translate(-3%,-2%) scale(1)}to{transform:translate(3%,3%) scale(1.08)}}

function approve(id){const x=D.st[id],k=S.office||'ncssc',p=x.po[k];p.paid=true;p.choice='paid';p.date=new Date().toLocaleString();const rc=mkReceipt(x,k);notif(x,'Payment to '+offName(k)+' confirmed. Your e-receipt '+rc.no+' is saved in My Receipts.');let msg;
  if(allPaid(x)){x.paid=true;notif(x,'All payments confirmed. Waiting for your Faculty Adviser to approve your enrollment.');onotif('adv',x.id+' · '+x.name+' ('+x.course+' '+x.section+') has paid all offices. Waiting for your approval.',x.id);msg=x.name+' is fully paid. Sent to the Faculty Adviser for approval'}
  else msg='Confirmed. '+x.name+' still has other offices to pay.';
  sync(x);S.modal=null;notify(msg);render()}
function enrollName(id){const x=D.st[id];x.listed=true;x.enr='Pending';notif(x,'Your name was enrolled by the officer, but your status is PENDING until you pay '+peso(unpaidAmt(x))+'.');sync(x);S.modal=null;notify('Saved as Pending. Student notified.');render()}
/* ---- adviser ---- */
function aList(){const a=subs().filter(mineAdv),T=['Awaiting','Approved','Not yet paid','All'],f=a.filter(x=>S.tab==='All'||aStat(x)===S.tab);
 return `<div class="welcome"><div><div class="eyebrow">Faculty Adviser</div><h1>Student List</h1><p>Students who paid all offices are ready for your approval. Review their documents, then approve their enrollment.${S.courses&&S.courses.length?' Showing: <b>'+esc(S.courses.join(', '))+'</b>':''}</p></div></div>
 <div class="tabs">${T.map(t=>`<button class="btn ${S.tab===t?'btn-primary':'btn-light'}" onclick="S.tab='${t}';render()">${t} (${t==='All'?a.length:a.filter(x=>aStat(x)===t).length})</button>`).join('')}</div>
 <div class="panel tw"><table class="tbl"><tr><th>ID Number</th><th>Name</th><th>Course</th><th>Section</th><th>Payments</th><th>Adviser Approval</th><th></th></tr>${f.length?f.map(x=>`<tr><td>${x.id}</td><td>${esc(x.name)}</td><td>${esc(x.course)}</td><td>${esc(x.section)}</td><td>${paidCount(x)}</td><td>${abadge(x)}</td><td><button class="btn btn-light" onclick="S.modal='${x.id}';render()">Review</button></td></tr>`).join(''):'<tr><td colspan="7" class="hint">No students here yet. Students appear when all their offices confirm payment.</td></tr>'}</table></div>`}
function aLog(){const a=subs().filter(x=>mineAdv(x)&&advOk(x));
 return `<div class="welcome"><div><div class="eyebrow">Faculty Adviser</div><h1>Approved Students</h1><p>${a.length} student${a.length===1?'':'s'} approved and enrolled.</p></div></div>
 <div class="panel tw"><table class="tbl"><tr><th>ID Number</th><th>Name</th><th>Course</th><th>Section</th><th>Approved by</th><th>Approved on</th></tr>${a.length?a.map(x=>`<tr><td>${x.id}</td><td>${esc(x.name)}</td><td>${esc(x.course)}</td><td>${esc(x.section)}</td><td>${esc((x.adv&&x.adv.by)||'')}</td><td>${esc((x.adv&&x.adv.date)||'')}</td></tr>`).join(''):'<tr><td colspan="6" class="hint">No approved students yet.</td></tr>'}</table></div>`}
function advModal(x){const K=(ok,t)=>`<div class="chk"><i class="${ok?'ok':'no'}">${ok?'✔':'✖'}</i>${t}</div>`;
 const offs=OFFICES.map(o=>amt(x,o.k)?K(x.po[o.k].paid,o.n+': '+poStat(x,o.k)+' · '+peso(amt(x,o.k))+(x.po[o.k].ref?' · Ref '+esc(x.po[o.k].ref):'')):'').join('');
 return box(`<h3>${esc(x.name)} ${abadge(x)}</h3><div class="hint" style="margin-bottom:8px">${x.id} · ${esc(x.course)} · ${esc(x.section)}</div>
 ${offs}${hist(x)}${K(fl(x.clr).length>0,'Old clearance uploaded'+(fl(x.clr).length>1?' ('+fl(x.clr).length+')':''))}${K(rcl(x).length>0||(x.rc||[]).length>0,(x.rc||[]).length?'Past receipts on file in the system':'Past semester receipt'+(rcl(x).length>1?'s':'')+' uploaded ('+rcl(x).length+')')}
 ${pics(x.clr,'Old clearance')}${pics(x.rcp,'Past semester receipt')}
 ${advOk(x)&&x.adv&&x.adv.by?`<p class="hint">Approved by ${esc(x.adv.by)} on ${esc(x.adv.date)}</p>`:''}
 ${!allPaid(x)?'<p class="hint">You can approve once all offices have confirmed this student\'s payment.</p>':''}
 <div class="form-actions" style="justify-content:flex-start">${allPaid(x)&&!advOk(x)?`<button class="btn btn-primary" onclick="advApprove('${x.id}')">APPROVE ENROLLMENT</button>`:''}${closeB}</div>`)}
function advApprove(id){const x=D.st[id];if(!x||!allPaid(x)||advOk(x))return;x.adv={ok:true,by:S.uid||'Faculty Adviser',date:new Date().toLocaleString()};x.enr='Enrolled';notif(x,'Congratulations! Your Faculty Adviser approved your enrollment. You are now ENROLLED for '+D.term+'.');
 sync(x);S.modal=null;notify(x.name+' is now Enrolled');render()}
document.addEventListener('click',e=>{const t=e.target;if(t&&t.tagName==='IMG'&&t.classList.contains('thumb')&&t.src)openPv(t.src)});
load();render();
</script>
</body>
